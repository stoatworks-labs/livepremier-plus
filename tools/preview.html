<!doctype html>
<!--
  The VPU panel, rendered from a recorded capture with no device in front of you.

  There is no Aquilon to point this extension at any more, and it cannot be seen
  any other way: tools/serve.mjs needs a real Web RCS tab to inject into, and the
  panel only ever draws what a device store says. So this page builds the store
  shape out of a capture in test/fixtures and mounts the panel against it.

      npm run serve
      open http://127.0.0.1:8765/tools/preview.html

  It is a dev harness, not a feature — no MV3 plumbing, no websocket, no cue
  stack, and the vendor page's own stylesheet is absent so the layout is plainer
  than the real thing. What it does show truthfully is the link grid, which is
  the part that is easy to get wrong and impossible to check by reading.
-->
<meta charset="utf-8">
<title>LivePremier Plus — VPU panel preview</title>
<style>
  body { margin: 0; background: #08141B; color: #C7CDD1;
         font-family: OpenSans, Helvetica, Arial, sans-serif; }
  .bar { display: flex; gap: 1rem; align-items: center; padding: 0.75rem 1rem;
         border-bottom: 1px solid #2A343B; font-size: 0.85rem; }
  select { background: #16232B; color: inherit; border: 1px solid #49535B;
           border-radius: 3px; padding: 0.3rem 0.5rem; font: inherit; }
  .note { color: #838B91; }
</style>

<div class="bar">
  <label>Capture <select id="pick"></select></label>
  <label>Side <select id="side"><option value="current">current</option><option value="new">new</option></select></label>
  <label><input type="checkbox" id="outputs"> synthesise outputs</label>
  <span class="note">Recorded captures only — no device is contacted. Synthesised outputs are invented from each screen's own figures; only the 2026-09-09 capture carries real ones.</span>
</div>
<div id="mount"></div>

<script type="module">
  import { installStyles } from '../src/ui/theme.js';
  import { createVpuPanel } from '../plugins/vpu-map/panel.js';
  import { DeviceStore } from '../src/core/device-store.js';

  const CAPTURES = [
    ['aquilon-c-6output-5k.json', 'Six-output screen + a 5K layer'],
    ['aquilon-c-live-resources.json', 'Live resources capture'],
    ['aquilon-c-dual-outputs.json', 'Single-output screens, with the real outputs (2026-09-09)'],
  ];

  installStyles(document);

  /*
   * The device store the panel reads, built from a capture's mixer table.
   * Mirrors test/core.test.js's storeWithMixers — the same shape the vendor page
   * holds in memory, `pp` for properties and `items` for collections.
   */
  function storeFromCapture(capture) {
    const side = (mixers) => {
      const items = {};
      for (const [id, rec] of Object.entries(mixers || {})) {
        if (!rec.isAvailable) { items[id] = { pp: { isAvailable: false } }; continue; }
        const { mixerAllocation, scalers, ...pp } = rec;
        items[id] = { pp: { ...pp, isAvailable: true }, mixerAllocation: { pp: { ...mixerAllocation } } };
        if (scalers) {
          items[id].scalerList = {
            itemKeys: Object.keys(scalers),
            items: Object.fromEntries(Object.entries(scalers).map(([k, v]) => [k, { pp: { ...v } }])),
          };
        }
      }
      return {
        status: { mapping: { deviceList: { itemKeys: ['1'], items: { 1: {
          vpuMixerList: { itemKeys: Object.keys(mixers || {}), items },
        } } } } },
      };
    };

    const withScreens = (node, status) => {
      if (!status) return node;
      node.screenList = {
        itemKeys: Object.keys(status),
        items: Object.fromEntries(
          Object.entries(status).map(([k, v]) => [k, { status: { pp: { ...v } } }])),
      };
      return node;
    };

    // The panel reads through DeviceStore's own accessors, not a plain object, so
    // hydrate a real one — the same thing test/core.test.js does. A capture that
    // is already store-shaped (the live-resources one) hydrates as it is.
    const store = new DeviceStore();
    if (capture.device) {
      store.hydrate(capture);
      return store;
    }
    const status = capture.screenStatus || {};
    store.hydrate({
      device: { preconfig: { resources: {
        current: withScreens(side(capture.current), status.current),
        new: withScreens(side(capture.new || capture.current), status.new || status.current),
      } } },
    });
    return store;
  }

  /*
   * An outputList invented from the screens' own figures, so the header over
   * the grid has something to draw: each configured screen gets outputCount
   * outputs, 4K when its usedOutputCapabilities is two per output and DUAL
   * otherwise, numbered on from 1, all in region 1. Nothing about it is real
   * but the sums, which is exactly what screenOutputLinks checks.
   */
  function synthesiseOutputs(store, which) {
    const base = ['device', 'preconfig', 'resources', which, 'screenList', 'items'];
    const screens = store.get(base) || {};
    const items = {};
    let n = 1;
    for (const [id, node] of Object.entries(screens)) {
      const st = (node.status || {}).pp || {};
      if (!st.mode || st.mode === 'DISABLED' || !st.outputCount) continue;
      const capability = st.usedOutputCapabilities === 2 * st.outputCount ? '4K' : 'DUAL';
      for (let i = 0; i < st.outputCount; i++, n++) {
        items[n] = {
          canvas: { status: { pp: { usedInScreenAux: id, usedInRegion: '1', capability } } },
          control: { pp: { label: '' } },
          mapping: { pp: { card: 'OUT_' + (Math.floor((n - 1) / 4) + 1), physical: String(((n - 1) % 4) + 1) } },
          plugList: { itemKeys: ['1'], items: { 1: { status: { pp: { type: 'HDMI' } } } } },
        };
      }
    }
    store.set(['device', 'outputList'], { itemKeys: Object.keys(items), items });
  }

  const pick = document.getElementById('pick');
  const sideSel = document.getElementById('side');
  const outputsBox = document.getElementById('outputs');
  const mount = document.getElementById('mount');
  pick.replaceChildren(...CAPTURES.map(([file, label]) =>
    Object.assign(document.createElement('option'), { value: file, textContent: label })));

  async function show() {
    const res = await fetch(`../test/fixtures/${pick.value}`);
    const capture = await res.json();
    const store = storeFromCapture(capture);
    if (outputsBox.checked) synthesiseOutputs(store, sideSel.value);
    // createVpuPanel returns { render, view } — `view` is the panel's own state,
    // which is how the real shell drives it too.
    const panel = createVpuPanel({ session: { store }, onRefresh: () => paint() });
    panel.view.which = sideSel.value;
    const paint = () => mount.replaceChildren(panel.render());
    paint();
  }

  pick.addEventListener('change', show);
  sideSel.addEventListener('change', show);
  outputsBox.addEventListener('change', show);
  show();
</script>
