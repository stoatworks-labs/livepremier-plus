# LivePremier Plus desktop app config.
#
# Simpler than most of the fleet's launchers: LivePremier Plus is a zero-
# dependency Node program with no build step, so the bundle carries a Node
# runtime and a straight copy of the repo's server/ and src/ trees. Nothing is
# compiled, nothing is installed. {resource} = the .app resource dir.
#
# The switcher can be named here OR left blank. Blank is the normal case: the
# app's own setup page asks for it in the browser and remembers it, which is
# what lets an operator re-point at a backup frame without restarting anything
# — and works from a browser on a different machine, which a launcher field
# cannot. The field is here for the fixed-install case where the box never
# changes and nobody should be asked twice.
#
# An empty field injects an empty LPP_DEVICE, which the server treats as unset
# and falls through to the remembered device. So blank is safe, not broken.

[app]
name = "LivePremier Plus"
command = "{resource}/node"
args = ["{resource}/livepremier-plus-app/server/index.js"]
url = "http://{host}:{port}/"
default_port = 8534
# cwd omitted -> runs from the writable app-config dir.

[inject]
mode = "env"

[inject.env]
LPP_PORT = "{port}"
LPP_HOST = "{host}"
LPP_DEVICE = "{device}"

# Optional. Blank means "ask in the browser and remember it" — see above.
[[field]]
key = "device"
label = "Switcher (optional)"
type = "text"
placeholder = "192.168.2.142"

# Palette mirrored from the app's own setup page.
[app.theme]
bg = "#0f1114"
panel = "#171a1f"
"panel-2" = "#1d2128"
border = "#2b3038"
text = "#e7e8ea"
muted = "#8a909a"
dim = "#6b717b"
accent = "#4c8dff"
"accent-soft" = "#14203a"
good = "#5ad18a"
