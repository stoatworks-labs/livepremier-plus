<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>How LivePremier Plus sits between the browser and the switcher</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8fa3b8"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f5a623"/>
    </marker>
  </defs>
  <rect width="960" height="520" rx="10" fill="#161b21"/>

  <!-- browser -->
  <rect x="24" y="40" width="250" height="300" rx="8" fill="#212932" stroke="#3a4552"/>
  <text x="40" y="68" fill="#e8edf2" font-size="17" font-weight="600">Browser</text>
  <text x="40" y="88" fill="#8fa3b8" font-size="12">http://127.0.0.1:8535/</text>
  <rect x="40" y="104" width="218" height="96" rx="6" fill="#2b3540"/>
  <text x="54" y="128" fill="#e8edf2" font-size="13" font-weight="600">The vendor's own Web RCS</text>
  <text x="54" y="148" fill="#b7c4d1" font-size="12">its bundle, its CSS, its socket —</text>
  <text x="54" y="166" fill="#b7c4d1" font-size="12">served unchanged</text>
  <rect x="40" y="212" width="218" height="112" rx="6" fill="#1f3a57" stroke="#3b82c4"/>
  <text x="54" y="236" fill="#e8edf2" font-size="13" font-weight="600">+ the panels, page halves</text>
  <text x="54" y="256" fill="#b7c4d1" font-size="12">Edit · Timeline · Console · Layer</text>
  <text x="54" y="274" fill="#b7c4d1" font-size="12">Groups · Matrix · HyperDecks</text>
  <text x="54" y="292" fill="#b7c4d1" font-size="12">MIDI · Speed Editor · Companion</text>
  <text x="54" y="312" fill="#8fa3b8" font-size="11">Web MIDI: loopback only</text>

  <!-- proxy -->
  <rect x="355" y="40" width="250" height="300" rx="8" fill="#212932" stroke="#f5a623"/>
  <text x="371" y="68" fill="#e8edf2" font-size="17" font-weight="600">LivePremier Plus</text>
  <text x="371" y="88" fill="#8fa3b8" font-size="12">a local Node process</text>
  <text x="371" y="120" fill="#e8edf2" font-size="12">• proxies every request, untouched</text>
  <text x="371" y="140" fill="#e8edf2" font-size="12">• adds two script tags to index.html</text>
  <text x="371" y="160" fill="#e8edf2" font-size="12">• relays the WebSocket byte for byte</text>
  <text x="371" y="180" fill="#e8edf2" font-size="12">• one device connection per tab</text>
  <rect x="371" y="200" width="218" height="124" rx="6" fill="#2b3540"/>
  <text x="385" y="224" fill="#e8edf2" font-size="13" font-weight="600">plugins, server halves</text>
  <text x="385" y="244" fill="#b7c4d1" font-size="12">cue stacks, groups, names</text>
  <text x="385" y="262" fill="#b7c4d1" font-size="12">router drivers · deck links</text>
  <text x="385" y="280" fill="#b7c4d1" font-size="12">OSC listener · setup file</text>
  <text x="385" y="298" fill="#b7c4d1" font-size="12">~/.livepremier-plus/</text>
  <text x="385" y="315" fill="#8fa3b8" font-size="11">+ plugins of your own</text>

  <!-- switcher -->
  <rect x="686" y="40" width="250" height="150" rx="8" fill="#212932" stroke="#3a4552"/>
  <text x="702" y="68" fill="#e8edf2" font-size="17" font-weight="600">Switcher</text>
  <text x="702" y="88" fill="#8fa3b8" font-size="12">LivePremier · Midra 4K · Alta 4K</text>
  <text x="702" y="120" fill="#b7c4d1" font-size="12">HTTP + WebSocket: Web RCS</text>
  <text x="702" y="140" fill="#b7c4d1" font-size="12">TCP 10606: AWJ — brief, per</text>
  <text x="702" y="158" fill="#b7c4d1" font-size="12">exchange, five clients at most</text>

  <!-- arrows browser <-> proxy -->
  <line x1="276" y1="150" x2="353" y2="150" stroke="#8fa3b8" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="314" y="140" fill="#8fa3b8" font-size="11" text-anchor="middle">HTTP · WS</text>
  <!-- proxy <-> switcher -->
  <line x1="607" y1="110" x2="684" y2="110" stroke="#8fa3b8" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="645" y="100" fill="#8fa3b8" font-size="11" text-anchor="middle">same socket</text>
  <line x1="607" y1="150" x2="684" y2="150" stroke="#f5a623" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#o)"/>
  <text x="645" y="170" fill="#f5a623" font-size="11" text-anchor="middle">AWJ</text>

  <!-- side systems -->
  <rect x="686" y="214" width="250" height="126" rx="8" fill="#212932" stroke="#3a4552"/>
  <text x="702" y="240" fill="#e8edf2" font-size="14" font-weight="600">What else it talks to</text>
  <text x="702" y="262" fill="#b7c4d1" font-size="12">Videohub · Lightware · Turtle AV</text>
  <text x="702" y="280" fill="#b7c4d1" font-size="12">HyperDeck · Mitti</text>
  <text x="702" y="298" fill="#b7c4d1" font-size="12">Bitfocus Companion</text>
  <text x="702" y="316" fill="#b7c4d1" font-size="12">Pixelhue U5 / U5 Pro / U5 mini</text>
  <line x1="607" y1="275" x2="684" y2="275" stroke="#8fa3b8" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- inbound control -->
  <rect x="355" y="378" width="250" height="104" rx="8" fill="#212932" stroke="#3a4552"/>
  <text x="371" y="404" fill="#e8edf2" font-size="14" font-weight="600">Control from outside</text>
  <text x="371" y="426" fill="#b7c4d1" font-size="12">OSC over UDP — QLab, TouchOSC,</text>
  <text x="371" y="444" fill="#b7c4d1" font-size="12">a lighting desk. Off until switched on;</text>
  <text x="371" y="462" fill="#b7c4d1" font-size="12">works with no browser open</text>
  <line x1="480" y1="376" x2="480" y2="342" stroke="#8fa3b8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="24" y="378" width="250" height="104" rx="8" fill="#212932" stroke="#3a4552"/>
  <text x="40" y="404" fill="#e8edf2" font-size="14" font-weight="600">Surfaces on this machine</text>
  <text x="40" y="426" fill="#b7c4d1" font-size="12">MIDI controllers (Web MIDI)</text>
  <text x="40" y="444" fill="#b7c4d1" font-size="12">Speed Editor (USB, via the app)</text>
  <text x="40" y="462" fill="#b7c4d1" font-size="12">LTC / MTC timecode</text>
  <line x1="149" y1="376" x2="149" y2="342" stroke="#8fa3b8" stroke-width="2" marker-end="url(#a)"/>

  <text x="686" y="420" fill="#8fa3b8" font-size="12">Loopback by default. Binding wide</text>
  <text x="686" y="438" fill="#8fa3b8" font-size="12">hands the switcher's whole control</text>
  <text x="686" y="456" fill="#8fa3b8" font-size="12">surface to the network.</text>
</svg>
